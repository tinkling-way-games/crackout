# Issue や PR で @claude とメンションすると、GitHub Actions 上で Claude Code が動く。
# 事前準備: リポジトリの Secrets に CLAUDE_CODE_OAUTH_TOKEN (または ANTHROPIC_API_KEY) を登録し、
# Claude GitHub App をインストールしておく。ローカルで `claude` → `/install-github-app` を実行すると両方まとめて設定できる。
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API キーを使う場合は上の行の代わりに:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
