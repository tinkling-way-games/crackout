<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ブロック崩し</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --fg: #c9d4f0;
        --muted: #7482a8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
      }
      canvas {
        display: block;
        width: min(100%, 800px, calc((100vh - 80px) * 4 / 3));
        aspect-ratio: 4 / 3;
        border-radius: 10px;
        box-shadow: 0 0 0 1px #1f2a4a, 0 20px 60px #0008;
        touch-action: none;
        cursor: none;
      }
      p { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
      kbd {
        font: inherit;
        padding: 1px 6px;
        border: 1px solid #2a365c;
        border-radius: 4px;
        background: #141c36;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="600" aria-label="ブロック崩しのゲーム画面"></canvas>
    <p>
      移動 <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> / マウス・タッチ
      ・発射 <kbd>Space</kbd> / クリック / タップ
      ・一時停止 <kbd>P</kbd> / <kbd>Esc</kbd>
      ・音 <kbd>M</kbd>
    </p>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
